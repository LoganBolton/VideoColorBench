name: eval

# Runs one raw-mode experiment file (see experiments/README.md) against OpenRouter and commits the
# results folder. Needs a repository secret named OPENROUTER_API_KEY. Harness-mode experiments need
# a logged-in Claude Code or Codex, so run those on your own machine.
on:
  workflow_dispatch:
    inputs:
      config:
        description: Experiment file
        required: true
        default: experiments/sol-medium-youtube-raw.yaml
      limit:
        description: Only the first N questions (blank for all)
        default: ""

concurrency:
  group: eval
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Run experiment
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          uv run run.py "${{ inputs.config }}" ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }} | tee eval.log
          { echo '```'; tail -n 30 eval.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git diff --cached --quiet && exit 0
          git commit -m "Eval results: ${{ inputs.config }}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
